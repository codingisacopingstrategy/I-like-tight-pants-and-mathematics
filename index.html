<script>
function updateCountdown() {
  const now = new Date();
  // Paris timezone target
  const target = new Date("2026-03-11T19:30:00+01:00");
  const diff = target - now;

  if (diff <= 0) {
    document.getElementById("countdown").textContent = "waiting for the red button…";
    return;
  }

  const totalSeconds = Math.floor(diff / 1000);

  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  const text = `${hours} hours and ${minutes} minutes and ${seconds} seconds`;

  document.getElementById("countdown").textContent = text;
}

updateCountdown();
setInterval(updateCountdown, 1000);

navigator.requestMIDIAccess()
        .then(onMIDISuccess, onMIDIFailure);

function onMIDIFailure() {
  console.log('Could not access your MIDI devices.');
}

function onMIDISuccess(midiAccess) {
  console.log("succesfully requested MIDI access");
  var inputs = midiAccess.inputs.values();
  console.log(inputs);
  for (var input = inputs.next(); input && !input.done; input = inputs.next()) {
    input.value.onmidimessage = getMIDIMessage;
  }
}
