<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rue Marthe 31 · Paris</title>

<style>
@font-face {
  font-family: 'QTSchoolCentury';
  src: url('./the/style/in/fonts/such/as/QTSchoolCentury-Times-New_Romance-BoldItalic.ttf');
}
@font-face {
  font-family: 'Chemins';
  src: url('./the/style/in/fonts/such/as/Chemins_Regular.ttf');
}


html, body {
  height: 100%;
  margin: 0;
}

body {
  background: #ff0087;
  color: #fff;
  font-family: "QTSchoolCentury", serif;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.wrapper {
  max-width: 90vw;
}

#countdown {
  font-size: 128px;
  line-height: 1.1;
}

.subtitle {
  font-size: 36px;
  margin-top: 72px;
  font-family: Chemins;
}
</style>
</head>

<body>

<div class="wrapper">
  <div id="countdown">…</div>
  <div class="subtitle">
    until the (re)launch of <em>I like tight pants and mathematics</em>
  </div>
</div>

<script>
function updateCountdown() {

  const now = new Date();

  // Paris timezone target
  const target = new Date("2026-03-11T19:30:00+01:00");

  const diff = target - now;

  if (diff <= 0) {
    document.getElementById("countdown").textContent = "0 hours and 0 minutes and 0 seconds";
    return;
  }

  const totalSeconds = Math.floor(diff / 1000);

  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;

  const text = `${hours} hours and ${minutes} minutes and ${seconds} seconds`;

  document.getElementById("countdown").textContent = text;
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
